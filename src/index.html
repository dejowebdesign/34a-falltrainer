<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>34a Falltrainer – Fallbeispiele zur Sachkundeprüfung</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interaktiver Falltrainer für die Sachkundeprüfung nach §34a GewO: Verhalten, rechtliche Einordnung und Rechtsgrundlage in drei Stufen trainieren.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    // Theme vor dem ersten Paint setzen, damit kein heller Blitz entsteht.
    (function () {
      try {
        var stored = localStorage.getItem('ft-theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        document.documentElement.classList.add('light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
