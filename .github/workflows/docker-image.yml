name: Docker Image

# Baut das Produktions-Image und veröffentlicht es in der GitHub Container
# Registry (GHCR). Erst nach erfolgreicher CI (Build + Tests).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Build und Tests. Ohne grünen Testlauf wird kein Image veröffentlicht.
  ci:
    name: Build und Tests
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js LTS einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

      - name: Production Build erstellen
        run: npm run build

  # 2. Image bauen und nach GHCR pushen. Hängt von der CI ab.
  docker:
    name: Docker Image nach GHCR
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: QEMU einrichten (für arm64)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels erzeugen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,format=long,prefix=sha-
            type=ref,event=tag

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Umbrel läuft je nach Gerät auf amd64 (Umbrel Home / x86) oder
          # arm64 (Raspberry Pi). Beide Architekturen werden veröffentlicht.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
