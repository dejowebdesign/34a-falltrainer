name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nur Leserechte: CI baut und testet, sie veröffentlicht nichts.
permissions:
  contents: read

# Bei neuen Pushes auf denselben Ref laufende Jobs abbrechen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build und Tests
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js LTS einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

      - name: Production Build erstellen
        run: npm run build
