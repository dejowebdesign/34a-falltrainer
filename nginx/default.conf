# nginx-Konfiguration für die Angular-App (SPA).
#
# Aufgabe: statische Dateien ausliefern und bei unbekannten Routen index.html
# als Fallback liefern, damit das Angular Client-Side-Routing auch bei direkter
# Navigation (z. B. /scenarios/xyz/stage/2) funktioniert.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip für Text-Assets – geringer Aufwand, spürbare Ersparnis.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml;

    # index.html nicht cachen, damit neue Deployments sofort greifen.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Gehashte Build-Assets (outputHashing: all) sind unveränderlich und
    # dürfen lange gecacht werden.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # SPA-Fallback: unbekannte Pfade liefern index.html aus.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sicherheits-Header mit geringem Aufwand.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fehlerseiten nicht an nginx-Standardseiten leiten.
    error_page 404 /index.html;
}
